# /etc/nginx/sites-available/lavanderosjanitorial.ca
# HTTPS is added afterwards by: certbot --nginx -d lavanderosjanitorial.ca -d www.lavanderosjanitorial.ca

# www -> non-www
server {
    listen 80;
    listen [::]:80;
    server_name www.lavanderosjanitorial.ca;
    return 301 http://lavanderosjanitorial.ca$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name lavanderosjanitorial.ca;

    root /var/www/lavanderos-web;
    index index.html;
    charset utf-8;

    # Never serve source / server / repo folders
    location ~ ^/(build|server|deploy|node_modules)(/|$) { return 404; }
    location ~ /\.(?!well-known) { deny all; }
    location ~ \.(md|json|lock|env|example)$ { return 404; }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;

    # Quote form API (Node on 127.0.0.1:3100)
    location /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 32k;
    }

    # Static assets cache
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|ico|woff2)$ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
