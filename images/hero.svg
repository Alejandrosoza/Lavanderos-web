<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Commercial building illustration">
  <rect width="480" height="360" fill="#eef3f8"/>
  <!-- mountains (Yukon) -->
  <path d="M0 250 L90 150 L150 210 L230 120 L320 220 L380 170 L480 250 Z" fill="#d9e1e8"/>
  <path d="M230 120 L252 145 L238 142 L226 152 L214 140 Z" fill="#ffffff"/>
  <!-- ground -->
  <rect y="290" width="480" height="70" fill="#d9e1e8"/>
  <!-- main building -->
  <rect x="140" y="110" width="180" height="180" fill="#ffffff" stroke="#0f2a44" stroke-width="3"/>
  <rect x="140" y="110" width="180" height="22" fill="#0f2a44"/>
  <g fill="#eef3f8" stroke="#0f2a44" stroke-width="2">
    <rect x="160" y="148" width="34" height="28"/><rect x="213" y="148" width="34" height="28"/><rect x="266" y="148" width="34" height="28"/>
    <rect x="160" y="192" width="34" height="28"/><rect x="213" y="192" width="34" height="28"/><rect x="266" y="192" width="34" height="28"/>
  </g>
  <rect x="210" y="236" width="40" height="54" fill="#2e9e5b" stroke="#0f2a44" stroke-width="2"/>
  <!-- side building -->
  <rect x="330" y="170" width="100" height="120" fill="#ffffff" stroke="#0f2a44" stroke-width="3"/>
  <g fill="#eef3f8" stroke="#0f2a44" stroke-width="2">
    <rect x="346" y="188" width="28" height="22"/><rect x="386" y="188" width="28" height="22"/>
    <rect x="346" y="224" width="28" height="22"/><rect x="386" y="224" width="28" height="22"/>
  </g>
  <!-- left building -->
  <rect x="50" y="190" width="80" height="100" fill="#ffffff" stroke="#0f2a44" stroke-width="3"/>
  <g fill="#eef3f8" stroke="#0f2a44" stroke-width="2">
    <rect x="64" y="206" width="22" height="20"/><rect x="96" y="206" width="22" height="20"/>
    <rect x="64" y="240" width="22" height="20"/><rect x="96" y="240" width="22" height="20"/>
  </g>
  <!-- sparkles -->
  <g fill="#2e9e5b">
    <path d="M300 70 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5 z"/>
    <path d="M110 120 l3.5 8 8 3.5 -8 3.5 -3.5 8 -3.5 -8 -8 -3.5 8 -3.5 z"/>
    <path d="M410 120 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 z"/>
  </g>
